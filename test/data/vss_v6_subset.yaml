# Curated subset of COVESA VSS v6.0 for testing purposes
# Based on the Vehicle Signal Specification by COVESA
# Licensed under CC-BY-4.0: https://creativecommons.org/licenses/by/4.0/
# Original source: https://github.com/COVESA/vehicle_signal_specification

Vehicle:
  type: branch
  description: "High-level vehicle data."

Vehicle.Speed:
  type: sensor
  datatype: float
  unit: km/h
  min: 0
  max: 600
  description: "Vehicle speed."

Vehicle.IsMoving:
  type: sensor
  datatype: boolean
  description: "Whether the vehicle is moving."

Vehicle.TraveledDistance:
  type: sensor
  datatype: float
  unit: km
  description: "Odometer reading, total distance traveled during lifetime."

Vehicle.TraveledDistanceSinceStart:
  type: sensor
  datatype: float
  unit: km
  description: "Distance traveled since start of current trip."

Vehicle.CurrentOverallWeight:
  type: sensor
  datatype: uint16
  unit: kg
  description: "Current overall vehicle weight."

Vehicle.AverageSpeed:
  type: sensor
  datatype: float
  unit: km/h
  description: "Average speed for the current trip."

Vehicle.VehicleIdentification:
  type: branch
  description: "Attributes that identify a vehicle."

Vehicle.VehicleIdentification.VIN:
  type: attribute
  datatype: string
  description: "17-character Vehicle Identification Number (VIN) as defined by ISO 3779."

Vehicle.VehicleIdentification.WMI:
  type: attribute
  datatype: string
  description: "3-character World Manufacturer Identifier (WMI) as defined by ISO 3780."

Vehicle.VehicleIdentification.Brand:
  type: attribute
  datatype: string
  description: "Vehicle brand or manufacturer."

Vehicle.VehicleIdentification.Model:
  type: attribute
  datatype: string
  description: "Vehicle model."

Vehicle.VehicleIdentification.Year:
  type: attribute
  datatype: uint16
  description: "Model year of the vehicle."

Vehicle.CurrentLocation:
  type: branch
  description: "The current latitude and longitude of the vehicle."

Vehicle.CurrentLocation.Latitude:
  type: sensor
  datatype: double
  unit: degrees
  min: -90
  max: 90
  description: "Current latitude of vehicle in WGS 84 geodetic coordinates."

Vehicle.CurrentLocation.Longitude:
  type: sensor
  datatype: double
  unit: degrees
  min: -180
  max: 180
  description: "Current longitude of vehicle in WGS 84 geodetic coordinates."

Vehicle.CurrentLocation.Altitude:
  type: sensor
  datatype: double
  unit: m
  description: "Current altitude relative to WGS 84 reference ellipsoid."

Vehicle.CurrentLocation.Heading:
  type: sensor
  datatype: double
  unit: degrees
  min: 0
  max: 360
  description: "Current heading relative to geographic north."

Vehicle.Cabin:
  type: branch
  description: "All in-cabin components, including doors, seats, HVAC."

Vehicle.Cabin.DriverPosition:
  type: attribute
  datatype: uint8
  allowed:
    - 1
    - 2
    - 3
    - 4
  description: "The position of the driver seat in row 1."

Vehicle.Cabin.SeatCount:
  type: attribute
  datatype: uint8
  description: "Number of seats in the vehicle."

Vehicle.Cabin.Door:
  type: branch
  description: "All doors, including windows and locks."
  instances:
    - - "Row1"
      - "Row2"
    - - "DriverSide"
      - "PassengerSide"

Vehicle.Cabin.Door.IsOpen:
  type: actuator
  datatype: boolean
  description: "True = Door is open. False = Door is closed."

Vehicle.Cabin.Door.IsLocked:
  type: actuator
  datatype: boolean
  description: "True = Door is locked. False = Door is unlocked."

Vehicle.Cabin.Door.Window:
  type: branch
  description: "Door window status."

Vehicle.Cabin.Door.Window.Position:
  type: actuator
  datatype: uint8
  unit: percent
  min: 0
  max: 100
  description: "Window position. 0 = Fully closed 100 = Fully open."

Vehicle.Cabin.Door.Window.IsOpen:
  type: sensor
  datatype: boolean
  description: "True = Window fully or partially open. False = Window fully closed."

Vehicle.Cabin.Seat:
  type: branch
  description: "All seats."
  instances:
    - - "Row1"
      - "Row2"
    - - "DriverSide"
      - "Middle"
      - "PassengerSide"

Vehicle.Cabin.Seat.IsBelted:
  type: sensor
  datatype: boolean
  description: "Is the belt engaged."

Vehicle.Cabin.Seat.IsOccupied:
  type: sensor
  datatype: boolean
  description: "Does the seat have a passenger in it."

Vehicle.Cabin.Seat.Heating:
  type: actuator
  datatype: int8
  min: -100
  max: 100
  description: "Seat heating/cooling. -100 = max cooling. 100 = max heating."

Vehicle.Cabin.Seat.Position:
  type: actuator
  datatype: uint16
  unit: mm
  min: 0
  description: "Seat position on vehicle x-axis."

Vehicle.Cabin.HVAC:
  type: branch
  description: "Heating, Ventilation, and Air Conditioning."

Vehicle.Cabin.HVAC.AmbientAirTemperature:
  type: sensor
  datatype: float
  unit: celsius
  description: "Ambient air temperature inside the vehicle."

Vehicle.Cabin.HVAC.IsAirConditioningActive:
  type: actuator
  datatype: boolean
  description: "True if AC is on."

Vehicle.Cabin.HVAC.IsRecirculationActive:
  type: actuator
  datatype: boolean
  description: "True if recirculation is activated."

Vehicle.Cabin.HVAC.IsFrontDefrosterActive:
  type: actuator
  datatype: boolean
  description: "True if the front defroster is active."

Vehicle.Cabin.HVAC.IsRearDefrosterActive:
  type: actuator
  datatype: boolean
  description: "True if the rear defroster is active."

Vehicle.Powertrain:
  type: branch
  description: "Powertrain data."

Vehicle.Powertrain.Type:
  type: attribute
  datatype: string
  allowed:
    - "COMBUSTION"
    - "HYBRID"
    - "ELECTRIC"
  description: "Defines the powertrain type of the vehicle."

Vehicle.Powertrain.CombustionEngine:
  type: branch
  description: "Engine-specific data, stopping at the bell housing."

Vehicle.Powertrain.CombustionEngine.Speed:
  type: sensor
  datatype: uint16
  unit: rpm
  description: "Engine speed measured as rotations per minute."

Vehicle.Powertrain.CombustionEngine.EngineOilTemperature:
  type: sensor
  datatype: int16
  unit: celsius
  description: "Engine oil temperature."

Vehicle.Powertrain.CombustionEngine.EngineOilLevel:
  type: sensor
  datatype: string
  allowed:
    - "CRITICALLY_LOW"
    - "LOW"
    - "NORMAL"
    - "HIGH"
    - "CRITICALLY_HIGH"
  description: "Engine oil level."

Vehicle.Powertrain.CombustionEngine.EngineCoolantTemperature:
  type: sensor
  datatype: int16
  unit: celsius
  description: "Engine coolant temperature."

Vehicle.Powertrain.CombustionEngine.Power:
  type: sensor
  datatype: uint16
  unit: kW
  description: "Current engine power output."

Vehicle.Powertrain.CombustionEngine.Torque:
  type: sensor
  datatype: int16
  unit: Nm
  description: "Current engine torque."

Vehicle.Powertrain.FuelSystem:
  type: branch
  description: "Fuel system data."

Vehicle.Powertrain.FuelSystem.Level:
  type: sensor
  datatype: uint8
  unit: percent
  min: 0
  max: 100
  description: "Level in fuel tank as percent of capacity."

Vehicle.Powertrain.FuelSystem.InstantConsumption:
  type: sensor
  datatype: float
  unit: l/100km
  description: "Current fuel consumption in liters per 100 km."

Vehicle.Powertrain.FuelSystem.Range:
  type: sensor
  datatype: uint32
  unit: m
  description: "Remaining range based on fuel level."

Vehicle.Powertrain.TractionBattery:
  type: branch
  description: "Battery management data."

Vehicle.Powertrain.TractionBattery.StateOfCharge:
  type: branch
  description: "Information on the state of charge of the vehicle's high voltage battery."

Vehicle.Powertrain.TractionBattery.StateOfCharge.Current:
  type: sensor
  datatype: float
  unit: percent
  min: 0
  max: 100
  description: "Physical state of charge of the high voltage battery."

Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed:
  type: sensor
  datatype: float
  unit: percent
  min: 0
  max: 100
  description: "State of charge displayed to the customer."

Vehicle.Powertrain.TractionBattery.NominalVoltage:
  type: attribute
  datatype: uint16
  unit: V
  description: "Nominal voltage of the battery."

Vehicle.Powertrain.TractionBattery.MaxVoltage:
  type: attribute
  datatype: uint16
  unit: V
  description: "Max allowed voltage of the battery."

Vehicle.Powertrain.TractionBattery.CurrentVoltage:
  type: sensor
  datatype: float
  unit: V
  description: "Current voltage of the battery."

Vehicle.Powertrain.TractionBattery.CurrentCurrent:
  type: sensor
  datatype: float
  unit: A
  description: "Current current flowing in/out of the battery."

Vehicle.Powertrain.TractionBattery.CurrentPower:
  type: sensor
  datatype: float
  unit: kW
  description: "Current power flowing in/out of the battery."

Vehicle.Powertrain.TractionBattery.Temperature:
  type: branch
  description: "Temperature of the battery pack."

Vehicle.Powertrain.TractionBattery.Temperature.Average:
  type: sensor
  datatype: float
  unit: celsius
  description: "Current average temperature of the battery cells."

Vehicle.Powertrain.TractionBattery.Temperature.Min:
  type: sensor
  datatype: float
  unit: celsius
  description: "Current minimum temperature of the battery cells."

Vehicle.Powertrain.TractionBattery.Temperature.Max:
  type: sensor
  datatype: float
  unit: celsius
  description: "Current maximum temperature of the battery cells."

Vehicle.Powertrain.TractionBattery.Range:
  type: sensor
  datatype: uint32
  unit: m
  description: "Remaining range based on battery charge."

Vehicle.Powertrain.TractionBattery.Charging:
  type: branch
  description: "Properties related to battery charging."

Vehicle.Powertrain.TractionBattery.Charging.IsCharging:
  type: sensor
  datatype: boolean
  description: "True if charging is ongoing."

Vehicle.Powertrain.TractionBattery.Charging.ChargeRate:
  type: sensor
  datatype: float
  unit: kW
  description: "Current charging rate."

Vehicle.Powertrain.Transmission:
  type: branch
  description: "Transmission-specific data."

Vehicle.Powertrain.Transmission.CurrentGear:
  type: sensor
  datatype: int8
  description: "The current gear. 0=Neutral. -1..x=Reverse. 1..x=Forward."

Vehicle.Powertrain.Transmission.Type:
  type: attribute
  datatype: string
  allowed:
    - "UNKNOWN"
    - "SEQUENTIAL"
    - "H"
    - "AUTOMATIC"
    - "DSG"
    - "CVT"
  description: "Transmission type."

Vehicle.Chassis:
  type: branch
  description: "All data concerning steering, suspension, wheels, and brakes."

Vehicle.Chassis.SteeringWheel:
  type: branch
  description: "Steering wheel data."

Vehicle.Chassis.SteeringWheel.Angle:
  type: sensor
  datatype: int16
  unit: degrees
  description: "Steering wheel angle. Positive = degrees to the left. Negative = degrees to the right."

Vehicle.Chassis.Axle:
  type: branch
  description: "Axle data."
  instances:
    - "Row1"
    - "Row2"

Vehicle.Chassis.Axle.Wheel:
  type: branch
  description: "Wheel data."
  instances:
    - "Left"
    - "Right"

Vehicle.Chassis.Axle.Wheel.Tire:
  type: branch
  description: "Tire data."

Vehicle.Chassis.Axle.Wheel.Tire.Pressure:
  type: sensor
  datatype: uint16
  unit: kPa
  description: "Tire pressure in kilo-Pascal."

Vehicle.Chassis.Axle.Wheel.Tire.Temperature:
  type: sensor
  datatype: float
  unit: celsius
  description: "Tire temperature in degrees Celsius."

Vehicle.Chassis.Axle.Wheel.Tire.IsPressureLow:
  type: sensor
  datatype: boolean
  description: "True if tire pressure is below recommended level."

Vehicle.Chassis.Axle.Wheel.Speed:
  type: sensor
  datatype: float
  unit: km/h
  description: "Rotational speed of a vehicle's wheel."

Vehicle.Chassis.Brake:
  type: branch
  description: "Brake data."

Vehicle.Chassis.Brake.PedalPosition:
  type: sensor
  datatype: uint8
  unit: percent
  min: 0
  max: 100
  description: "Brake pedal position. 0 = Not depressed. 100 = Fully depressed."

Vehicle.Chassis.Accelerator:
  type: branch
  description: "Accelerator data."

Vehicle.Chassis.Accelerator.PedalPosition:
  type: sensor
  datatype: uint8
  unit: percent
  min: 0
  max: 100
  description: "Accelerator pedal position. 0 = Not depressed. 100 = Fully depressed."

Vehicle.Exterior:
  type: branch
  description: "Information about exterior measured values."

Vehicle.Exterior.AirTemperature:
  type: sensor
  datatype: float
  unit: celsius
  description: "Air temperature outside the vehicle."

Vehicle.Exterior.Humidity:
  type: sensor
  datatype: float
  unit: percent
  min: 0
  max: 100
  description: "Relative humidity outside the vehicle."

Vehicle.Exterior.LightIntensity:
  type: sensor
  datatype: float
  unit: lux
  description: "Light intensity outside the vehicle."

Vehicle.OBD:
  type: branch
  description: "OBD data."

Vehicle.OBD.Status:
  type: branch
  description: "OBD status."

Vehicle.OBD.Status.IsMILOn:
  type: sensor
  datatype: boolean
  description: "True if the Malfunction Indicator Light is on."

Vehicle.OBD.Status.DTCCount:
  type: sensor
  datatype: uint8
  description: "Number of sensor Diagnostic Trouble Codes (DTC)."

Vehicle.OBD.EngineLoad:
  type: sensor
  datatype: float
  unit: percent
  min: 0
  max: 100
  description: "PID 04 - Engine load in percent."

Vehicle.OBD.CoolantTemperature:
  type: sensor
  datatype: float
  unit: celsius
  description: "PID 05 - Coolant temperature."

Vehicle.OBD.FuelPressure:
  type: sensor
  datatype: float
  unit: kPa
  description: "PID 0A - Fuel pressure."

Vehicle.OBD.ThrottlePosition:
  type: sensor
  datatype: float
  unit: percent
  min: 0
  max: 100
  description: "PID 11 - Throttle position."
